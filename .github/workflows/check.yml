name: Checks
on:
  push:
  pull_request:
    branches: [main, dev]

# Cancel superseded checks on the same ref, but never cancel a different event type.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# CI only reads repository contents; it never needs a write-capable token.
permissions:
  contents: read

jobs:
  verify:
    # Pin the runner image to avoid unexpected OS upgrades changing CI behavior.
    runs-on: ubuntu-24.04
    # Prevent stalled dependency installs or builds from consuming runners indefinitely.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # A reproducible lockfile will be committed after the first online npm install.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
