<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed} .app{max-width:1480px;margin:auto;min-height:100dvh;display:grid;grid-template-columns:360px minmax(0,1fr);border-left:1px solid #151515;border-right:1px solid #151515}.side{border-right:1px solid var(--line);min-width:0;display:flex;flex-direction:column;min-height:100dvh}.main{min-width:0;position:relative;display:flex;flex-direction:column;min-height:100dvh}.brand{padding:28px 24px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brandmark{display:flex;align-items:center;gap:12px}.symbol{width:34px;height:34px;border:1px solid var(--accent);border-radius:50%;position:relative;flex:none}.symbol:after{content:"";position:absolute;inset:8px;border:2px solid var(--accent);border-radius:50%}.brand strong{font-size:15px;letter-spacing:.19em;font-weight:650}.sub{font-size:12px;color:var(--muted);margin-top:5px}.iconbtn{border:1px solid var(--line);background:var(--layer2);border-radius:10px;min-width:44px;min-height:44px;padding:10px;display:inline-grid;place-items:center}.iconbtn:hover,.pill:hover,.tab:hover{border-color:#555}.sideintro{padding:12px 24px 8px}.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}h1{font-size:29px;line-height:1.12;letter-spacing:-.06em;font-weight:590;margin:13px 0}.descriptor{font-size:14px;line-height:1.5;color:var(--muted);max-width:260px}.switch{display:flex;gap:4px;padding:4px;background:var(--layer2);border:1px solid var(--line);border-radius:12px;margin:18px 24px 10px}.switch button{flex:1;border:0;border-radius:8px;background:transparent;min-height:40px;color:var(--muted);font-size:14px}.switch button.active{background:#252525;color:var(--text)}.search{margin:4px 24px 10px;background:var(--layer);border:1px solid var(--line);padding:0 13px;border-radius:10px;display:flex;align-items:center;gap:10px;min-height:46px;color:var(--muted)}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:16px}.search input::placeholder{color:var(--muted)}.list{overflow:auto;flex:1;padding:6px 12px 100px}.item{border:1px solid transparent;width:100%;display:flex;text-align:left;gap:12px;align-items:center;background:transparent;padding:12px;border-radius:12px;min-height:75px}.item:hover{background:var(--layer2)}.item.active{background:var(--layer3);border-color:#292929}.avatar{width:45px;height:45px;border-radius:50%;display:grid;place-items:center;flex:none;color:#f5f5f5;font-weight:650;font-size:14px;border:1px solid #454545;position:relative}.avatar:after{content:"";position:absolute;right:0;bottom:0;width:9px;height:9px;background:#72b39a;border:3px solid #111;border-radius:50%;display:none}.avatar.online:after{display:block}.av1{background:#33343a}.av2{background:#393128}.av3{background:#233c3b}.av4{background:#3a3037}.av5{background:#31373e}.av6{background:#343432}.av7{background:#263539}.itembody{flex:1;min-width:0}.itemtop{display:flex;justify-content:space-between;gap:8px;align-items:center}.name{font-weight:580;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:11px;color:var(--muted);white-space:nowrap}.excerpt{display:flex;align-items:center;justify-content:space-between;gap:7px;color:var(--muted);font-size:13px;margin-top:6px}.clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.count{min-width:20px;padding:3px 6px;background:var(--accent);color:#000;font-size:11px;border-radius:9px;text-align:center;font-weight:750}.sidefoot{position:sticky;bottom:0;background:#050505;border-top:1px solid var(--line);padding:12px 20px max(12px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;gap:8px}.navbtn{border:0;background:transparent;min-height:48px;min-width:75px;color:var(--muted);font-size:12px;display:grid;gap:4px;justify-items:center}.navbtn.active{color:var(--accent)}.navbtn svg{width:21px;height:21px}.head{min-height:85px;padding:18px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.heading{display:flex;align-items:center;gap:12px}.heading small{display:block;margin-top:5px;color:var(--muted);font-size:12px}.smalltext{color:var(--muted);font-size:13px}.workspace{display:flex;flex-direction:column;align-items:center;flex:1;min-height:0;position:relative;overflow:hidden}.worktop{align-self:stretch;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:27px 32px 0}.worktop strong{font-size:18px;font-weight:550}.worktop span{font-size:12px;color:var(--muted)}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid var(--line);border-radius:8px;min-height:39px;padding:7px 12px;background:var(--layer);font-size:12px}.pill.active{border-color:var(--accent);color:var(--accent)}.orbital{position:relative;aspect-ratio:1;max-height:min(69dvh,700px);width:min(100%,700px);margin:auto;isolation:isolate}.orbit{border:1px solid #252525;border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}.o1{width:31%;height:31%;border-color:#333}.o2{width:54%;height:54%}.o3{width:79%;height:79%}.o4{width:98%;height:98%;border-color:#191919}.axis{position:absolute;left:50%;top:50%;width:1px;height:100%;transform:translate(-50%,-50%);background:linear-gradient(transparent,#131313 50%,transparent);pointer-events:none}.axis.horizontal{transform:translate(-50%,-50%) rotate(90deg)}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:95px;height:95px;border-radius:50%;background:#060606;border:1px solid #545454;display:grid;place-content:center;text-align:center;z-index:2}.center .core{width:24px;height:24px;border:2px solid var(--accent);border-radius:50%;margin:0 auto 8px;position:relative}.center .core:after{content:"";position:absolute;inset:6px;background:var(--accent);border-radius:50%}.center small{font-size:10px;color:var(--muted)}.node{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;min-width:44px;min-height:44px;display:grid;place-items:center;z-index:3}.node .avatar{width:55px;height:55px;border-color:#606060;transition:transform .2s ease-out,border-color .2s ease-out}.node:hover .avatar,.node:focus-visible .avatar{transform:scale(1.1);border-color:var(--accent)}.node.selected .avatar{outline:2px solid var(--accent);outline-offset:4px}.node label{font-size:11px;white-space:nowrap;color:var(--text);margin-top:8px;background:#0009;padding:2px 5px;border-radius:4px}.node .count{position:absolute;top:-3px;right:-3px}.node.diamond .avatar{border-radius:13px;transform:rotate(45deg) scale(.82)}.node.diamond .avatar span{transform:rotate(-45deg)}.node.diamond:hover .avatar{transform:rotate(45deg) scale(.92)}.legend{align-self:stretch;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 32px 28px;color:var(--muted);font-size:12px}.legend strong{font-weight:500;color:var(--text)}.accentselect{display:flex;gap:7px}.swatch{min-height:35px;min-width:35px;border-radius:50%;border:2px solid transparent;background:transparent;display:grid;place-items:center}.swatch.active{border-color:#777}.swatch b{width:18px;height:18px;border-radius:50%;display:block}.chat{flex:1;display:flex;flex-direction:column;min-height:0}.messages{overflow:auto;flex:1;display:flex;flex-direction:column;gap:20px;padding:30px 8% 20px}.day{text-align:center;font-size:12px;color:var(--quiet);margin:12px auto}.message{max-width:min(78%,470px);align-self:flex-start}.message.mine{align-self:flex-end}.bubble{background:#171717;padding:12px 15px;border:1px solid #292929;border-radius:14px 14px 14px 4px;font-size:15px;line-height:1.5;overflow-wrap:anywhere}.mine .bubble{background:#16302e;border-color:#29524e;border-radius:14px 14px 4px 14px}.message footer{color:var(--quiet);font-size:11px;margin:6px 3px 0}.mine footer{text-align:right}.compose{padding:12px 26px max(20px,env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-end}.compose textarea{resize:none;min-height:45px;max-height:145px;flex:1;background:var(--layer2);border:1px solid #383838;color:var(--text);border-radius:10px;padding:11px 13px;font-size:16px;line-height:1.5}.send{border:0;border-radius:10px;background:var(--accent);color:#001614;min-height:46px;padding:0 20px;font-weight:700}.back{display:none}.empty{height:100%;display:grid;place-content:center;text-align:center;padding:25px;gap:12px;color:var(--muted)}.empty strong{color:var(--text)}.install{background:#111;border:1px solid #333;border-radius:12px;padding:14px 18px;position:absolute;bottom:86px;left:50%;transform:translateX(-50%);width:min(90%,420px);z-index:7;box-shadow:0 12px 40px #000}.install p{font-size:13px;color:var(--muted);line-height:1.5}.install button{background:var(--accent);border:0;border-radius:8px;min-height:40px;padding:0 14px;color:#000;font-weight:600}.hidden{display:none!important}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#222;border:1px solid #555;border-radius:10px;color:var(--text);padding:12px 18px;font-size:13px;z-index:20;max-width:90vw}.mobileOnly{display:none} .more{font-size:13px;color:var(--muted);padding:18px 28px;line-height:1.6}.more h2{font-size:23px;color:var(--text);font-weight:550}.optionrow{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:15px 0;gap:15px}.optionrow button{background:var(--layer2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:800px){.app{display:block;border:0}.side,.main{min-height:100dvh}.side{border:0}.main{display:none}.app.mobile-chat .side{display:none}.app.mobile-chat .main{display:flex}.brand{padding:19px 20px 10px}.sideintro{padding:10px 20px 6px}h1{font-size:26px}.descriptor{max-width:310px}.switch{margin:12px 20px}.search{margin:4px 20px 10px}.list{padding-bottom:105px}.main .head{padding:13px 15px;min-height:70px}.back{display:inline-grid}.worktop{padding:20px 17px 0;align-items:flex-start;flex-direction:column}.orbital{width:min(100vw,600px);max-height:min(56dvh,550px);margin:auto}.node .avatar{width:44px;height:44px}.node label{font-size:10px}.center{width:75px;height:75px}.legend{padding:8px 19px 26px;align-items:flex-start;flex-wrap:wrap}.mobileOnly{display:inline}.messages{padding:17px 16px}.message{max-width:87%}.compose{padding:10px 12px max(12px,env(safe-area-inset-bottom))}.send{padding:0 14px}.install{bottom:95px}.sidefoot{position:fixed;left:0;right:0;z-index:8}.orbital .o4{width:93%;height:93%}}
@media(min-width:801px){.sidefoot{position:sticky}.side .orbital{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.empty{max-width:420px;margin:auto;line-height:1.5}.empty strong{font-size:18px}.empty span{font-size:14px}.compose textarea:disabled{opacity:.55}.compose button:disabled{opacity:.55}
</style>

<body>
<div class="app" id="app">
<aside class="side" aria-label="Навигация">
 <div class="brand"><div class="brandmark"><span class="symbol" aria-hidden="true"></span><div><strong>IKONOSFERA</strong><div class="sub">Прототип интерфейса</div></div></div><button class="iconbtn" id="newBtn" aria-label="Новый чат" title="Новый чат">＋</button></div>
 <div class="sideintro"><div class="eyebrow">Твоё пространство</div><h1>Мир на связи.<br>Без лишнего.</h1><div class="descriptor">Важные люди ближе. Остальное под твоим контролем.</div></div>
 <div class="switch" role="group" aria-label="Режим отображения"><button id="sphereBtn" class="active" aria-pressed="true">Сфера</button><button id="listBtn" aria-pressed="false">Список</button></div>
 <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Найти человека или чат" aria-label="Поиск чата"></label>
 <div id="sideContent" class="list"></div>
 <nav class="sidefoot" aria-label="Основное меню"><button class="navbtn active" data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>Сфера</button><button class="navbtn" data-nav="chats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 5h16v12H9l-5 3V5Z"/></svg>Чаты</button><button class="navbtn" data-nav="focus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Фокус</button><button class="navbtn" data-nav="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="3"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>Профиль</button></nav>
</aside>
<main class="main" id="main"><header class="head"><div class="heading"><button class="iconbtn back" id="backBtn" aria-label="Назад к сфере">‹</button><span class="symbol" id="mainLogo" aria-hidden="true"></span><div><strong id="mainTitle">Твоя сфера</strong><small id="mainSubtitle">Ближе к важному</small></div></div><button class="iconbtn" id="infoBtn" aria-label="О прототипе">ⓘ</button></header><div class="workspace" id="workspace"></div></main>
</div><div class="toast hidden" role="status" id="toast"></div>
<script>
'use strict';
// Пример размещения узлов, не реальные аккаунты или переписки.
const people=[
{id:1,name:'Алина',initial:'А',style:1,x:48,y:28,mode:'friends'},
{id:2,name:'Даниил',initial:'Д',style:2,x:73,y:41,mode:'work'},
{id:3,name:'Мария',initial:'М',style:3,x:27,y:53,mode:'friends'},
{id:4,name:'Команда',initial:'К',style:4,x:62,y:72,mode:'work'},
{id:5,name:'Никита',initial:'Н',style:5,x:17,y:25,mode:'friends'},
{id:6,name:'Семья',initial:'С',style:6,x:83,y:65,mode:'family'},
{id:7,name:'Новости проекта',initial:'N',style:7,x:41,y:85,mode:'work',channel:true}
];
let view='sphere',selected=null,mode='all',search='',accent='teal',section='home',toastTimer;
const el=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const filt=()=>people.filter(p=>(mode==='all'||p.mode===mode)&&p.name.toLowerCase().includes(search.toLowerCase()));
function toast(s){el('toast').textContent=s;el('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el('toast').classList.add('hidden'),2600)}
function avatar(p){return `<span class="avatar av${p.style}"><span>${esc(p.initial)}</span></span>`}
function renderSide(){
  el('sphereBtn').classList.toggle('active',view==='sphere');
  el('listBtn').classList.toggle('active',view==='list');
  el('sphereBtn').setAttribute('aria-pressed',String(view==='sphere'));
  el('listBtn').setAttribute('aria-pressed',String(view==='list'));
  const arr=filt();
  el('sideContent').innerHTML=arr.length
    ?arr.map(p=>`<button class="item ${selected===p.id?'active':''}" data-open="${p.id}">${avatar(p)}<span class="itembody"><span class="itemtop"><span class="name">${esc(p.name)}</span></span><span class="excerpt"><span class="clip">Пример контакта · без переписки</span></span></span></button>`).join('')
    :'<p class="smalltext" style="padding:20px">Ничего не найдено</p>';
  el('sideContent').querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openChat(Number(b.dataset.open))));
}
function renderSphere(){el('mainTitle').textContent='Твоя сфера';el('mainSubtitle').textContent='Концепт расположения контактов';el('mainLogo').classList.remove('hidden');el('workspace').className='workspace';const arr=filt();el('workspace').innerHTML=`<div class="worktop"><div><strong>${section==='chats'?'Все разговоры':'Сфера общения'}</strong><br><span>${arr.length} примеров контактов · без реальных переписок</span></div><div class="pills" role="group" aria-label="Режим жизни">${[['all','Все'],['friends','Друзья'],['work','Работа'],['family','Семья']].map(([key,label])=>`<button class="pill ${mode===key?'active':''}" data-mode="${key}">${label}</button>`).join('')}</div></div>${view==='sphere'?`<div class="orbital" aria-label="Сфера контактов"><div class="orbit o1"></div><div class="orbit o2"></div><div class="orbit o3"></div><div class="orbit o4"></div><div class="axis"></div><div class="axis horizontal"></div><div class="center"><span class="core"></span><small>Ты здесь</small></div>${arr.map(p=>`<button class="node ${p.channel?'diamond':''}" style="left:${p.x}%;top:${p.y}%" data-open="${p.id}" aria-label="Открыть чат ${esc(p.name)}"><span class="avatar av${p.style} "><span>${esc(p.initial)}</span></span><label>${esc(p.name)}</label></button>`).join('')}</div>`:`<div class="list" style="align-self:stretch;width:100%;max-width:680px;margin:20px auto 0">${arr.map(p=>`<button class="item" data-open="${p.id}">${avatar(p)}<span class="itembody"><span class="itemtop"><span class="name">${esc(p.name)}${p.channel?' · Канал':''}</span><span class="time"></span></span><span class="excerpt"><span class="clip">Пример контакта · нет сообщений</span></span></span></button>`).join('')}</div>`}<div class="legend"><span>○ Ближе к центру — важнее · ◇ канал</span><div style="display:flex;align-items:center;gap:8px"><span>Акцент</span><div class="accentselect"><button class="swatch ${accent==='teal'?'active':''}" data-accent="teal" aria-label="Бирюзовый акцент" title="Бирюзовый"><b style="background:#4DD0C7"></b></button><button class="swatch ${accent==='amber'?'active':''}" data-accent="amber" aria-label="Янтарный акцент" title="Янтарный"><b style="background:#FFB84D"></b></button></div></div></div>`;el('workspace').querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;renderAll()}));el('workspace').querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openChat(Number(b.dataset.open))));el('workspace').querySelectorAll('[data-accent]').forEach(b=>b.addEventListener('click',()=>{accent=b.dataset.accent;document.documentElement.style.setProperty('--accent',accent==='amber'?'#FFB84D':'#4DD0C7');renderSphere()}));}
function renderChat(){
  const p=people.find(x=>x.id===selected);
  if(!p){renderSphere();return}
  el('mainTitle').textContent=p.name;
  el('mainSubtitle').textContent='Пример контакта · нет подключения';
  el('mainLogo').classList.add('hidden');
  el('workspace').className='workspace chat';
  el('workspace').innerHTML=`<div class="messages" aria-label="Сообщения">
    <div class="empty" role="status"><strong>Здесь пока нет сообщений</strong>
    <span>Этот экран показывает только внешний вид чата. Реальная переписка появится после подключения аккаунтов и сервера.</span></div></div>
    <div class="compose" aria-label="Отправка сообщений пока недоступна">
    <label class="sr-only" for="message">Сообщение</label>
    <textarea id="message" rows="1" placeholder="Отправка пока недоступна" disabled></textarea>
    <button class="send" disabled type="button">Отправить</button></div>`;
}
function openChat(id){
  selected=id;
  renderChat();renderSide();
  el('app').classList.add('mobile-chat');
}
function renderInfo(){selected=null;el('mainLogo').classList.remove('hidden');el('mainTitle').textContent=section==='profile'?'Профиль':'Режим фокуса';el('mainSubtitle').textContent='Интерактивная демонстрация';el('workspace').className='workspace';el('workspace').innerHTML=section==='profile'?`<div class="more" style="width:min(100%,620px)"><h2>Твоё пространство</h2><p>IKONOSFERA · дизайн-макет</p><div class="optionrow">Тема интерфейса <strong>Чёрная</strong></div><div class="optionrow">Состояние <strong>Локальное демо</strong></div><div class="optionrow">Дизайн-акцент <button id="changeAccent">Сменить</button></div><p>Это дизайн-макет без сервера. Сообщения отсутствуют, отправка отключена.</p></div>`:`<div class="more" style="width:min(100%,620px)"><h2>Важное остаётся рядом</h2><p>Смысл режима фокуса — показывать нужные разговоры, а не заставлять отключать всё сразу.</p><div class="optionrow">Сейчас активен режим <strong>${mode==='work'?'Работа':mode==='friends'?'Друзья':mode==='family'?'Семья':'Все'}</strong></div><div class="optionrow">Показать рабочие чаты <button id="focusWork">Включить</button></div><p>В реальном продукте настройки уведомлений будут сохраняться в аккаунте. Сейчас это визуальная демонстрация.</p></div>`;el('changeAccent')?.addEventListener('click',()=>{accent=accent==='teal'?'amber':'teal';document.documentElement.style.setProperty('--accent',accent==='amber'?'#FFB84D':'#4DD0C7');renderInfo()});el('focusWork')?.addEventListener('click',()=>{mode='work';section='home';renderAll()})}
function renderAll(){renderSide();if(section==='home'||section==='chats'){selected=null;renderSphere()}else renderInfo();document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===section))}
el('sphereBtn').addEventListener('click',()=>{view='sphere';section='home';renderAll();el('app').classList.add('mobile-chat')});el('listBtn').addEventListener('click',()=>{view='list';section='chats';renderAll();el('app').classList.add('mobile-chat')});el('search').addEventListener('input',e=>{search=e.target.value;renderSide();if(selected===null&&(section==='home'||section==='chats'))renderSphere()});el('newBtn').addEventListener('click',()=>toast('Создание чатов появится после подключения аккаунтов'));el('infoBtn').addEventListener('click',()=>toast('Макет: контакты вымышлены, сообщений и отправки нет'));el('backBtn').addEventListener('click',()=>{selected=null;renderAll();el('app').classList.remove('mobile-chat')});document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{section=b.dataset.nav;if(section==='chats')view='list';if(section==='home')view='sphere';renderAll();el('app').classList.add('mobile-chat')}));
renderAll();if(innerWidth<=800){el('app').classList.add('mobile-chat');}else{el('app').classList.remove('mobile-chat')}
</script>
